<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription eleve - Accident Auto</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
        background: #fff;
        line-height: 1.5;
      }

      .page {
        width: min(100% - 24px, 760px);
        margin: 0 auto;
        padding: 24px 0;
      }

      .top-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #111;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        line-height: 1.2;
      }

      .intro {
        margin: 0 0 24px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field-full {
        grid-column: 1 / -1;
      }

      label {
        font-weight: bold;
      }

      .required {
        color: #b00020;
      }

      input,
      select {
        width: 100%;
        min-height: 42px;
        border: 1px solid #999;
        border-radius: 4px;
        padding: 8px 10px;
        font: inherit;
        background: #fff;
      }

      input:focus,
      select:focus {
        outline: 2px solid #111;
        outline-offset: 2px;
      }

      .actions {
        margin-top: 20px;
      }

      .btn {
        min-height: 42px;
        border: 1px solid #111;
        border-radius: 4px;
        padding: 8px 16px;
        background: #111;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      .btn:hover {
        background: #333;
      }

      .small-link {
        margin-top: 16px;
      }

      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="top-link" href="/">Retour au site</a>

      <section aria-labelledby="form-title">
        <h1 id="form-title">Inscription eleve</h1>
        <p class="intro">
          Remplissez les informations principales pour creer votre compte.
        </p>

        <form action="/api/ajouter-eleve.php" method="post">
          <div class="form-grid">
            <div class="field">
              <label for="nom">Nom <span class="required">*</span></label>
              <input id="nom" name="nom" type="text" minlength="2" autocomplete="family-name" placeholder="Dupont" required />
            </div>

            <div class="field">
              <label for="prenom">Prenom <span class="required">*</span></label>
              <input id="prenom" name="prenom" type="text" minlength="2" autocomplete="given-name" placeholder="Jean" required />
            </div>

            <div class="field">
              <label for="email">Email <span class="required">*</span></label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="jean.dupont@email.fr" required />
            </div>

            <div class="field">
              <label for="telephone">Telephone</label>
              <input id="telephone" name="telephone" type="tel" inputmode="tel" autocomplete="tel" pattern="^0[1-9][0-9]{8}$" placeholder="0601020304" />
            </div>

            <div class="field field-full">
              <label for="type_permis">Type de permis</label>
              <select id="type_permis" name="type_permis">
                <option value="Permis B">Permis B</option>
                <option value="Conduite accompagnee">Conduite accompagnee</option>
                <option value="Permis AM">Permis AM</option>
                <option value="Permis moto">Permis moto</option>
                <option value="Boite automatique">Boite automatique</option>
              </select>
            </div>

            <div class="field">
              <label for="mot_de_passe">Mot de passe <span class="required">*</span></label>
              <input id="mot_de_passe" name="mot_de_passe" type="password" minlength="6" autocomplete="new-password" required />
            </div>

            <div class="field">
              <label for="confirmation_mot_de_passe">Confirmer le mot de passe <span class="required">*</span></label>
              <input id="confirmation_mot_de_passe" name="confirmation_mot_de_passe" type="password" minlength="6" autocomplete="new-password" required />
            </div>
          </div>

          <div class="actions">
            <button class="btn" type="submit">Creer mon compte</button>
          </div>

          <p class="small-link">
            Deja inscrit ? <a href="/connexion.html">Se connecter</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
