<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion eleve - Accident Auto</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111;
        background: #fff;
        line-height: 1.5;
      }

      .page {
        width: min(100% - 24px, 520px);
        margin: 0 auto;
        padding: 24px 0;
      }

      .top-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #111;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 2rem;
        line-height: 1.2;
      }

      .intro {
        margin: 0 0 24px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }

      label {
        font-weight: bold;
      }

      input {
        width: 100%;
        min-height: 42px;
        border: 1px solid #999;
        border-radius: 4px;
        padding: 8px 10px;
        font: inherit;
        background: #fff;
      }

      input:focus {
        outline: 2px solid #111;
        outline-offset: 2px;
      }

      .btn {
        min-height: 42px;
        border: 1px solid #111;
        border-radius: 4px;
        padding: 8px 16px;
        background: #111;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      .btn:hover {
        background: #333;
      }

      .small-link {
        margin-top: 16px;
      }

      @media (max-width: 640px) {
        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="top-link" href="/">Retour au site</a>

      <section aria-labelledby="login-title">
        <h1 id="login-title">Connexion eleve</h1>
        <p class="intro">Connectez-vous avec votre email et votre mot de passe.</p>

        <form action="/api/connexion.php" method="post">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="mot_de_passe">Mot de passe</label>
            <input id="mot_de_passe" name="mot_de_passe" type="password" autocomplete="current-password" required />
          </div>

          <button class="btn" type="submit">Se connecter</button>
        </form>

        <p class="small-link">
          Pas encore inscrit ? <a href="/formulaire.html">Creer un compte</a>
        </p>
      </section>
    </main>
  </body>
</html>
